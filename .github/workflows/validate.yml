name: Validate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest tests/ --ignore=tests/ha_runtime -v

  ha-runtime:
    name: Home Assistant ${{ matrix.ha }} runtime
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ha: "2026.9.4"
            requirements: tests/ha_runtime/requirements-ha-runtime.txt
          - ha: "2026.10.0"
            requirements: tests/ha_runtime/requirements-ha-runtime-2026.10.txt
          - ha: "2026.10.1"
            requirements: tests/ha_runtime/requirements-ha-runtime-2026.10.1.txt
          - ha: "2026.10.4"
            requirements: tests/ha_runtime/requirements-ha-runtime-2026.10.4.txt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install -r ${{ matrix.requirements }}
      - run: python -m pytest tests/ha_runtime/ -v

  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/check_docs.py
      - run: node --test tests/release-validation.test.cjs
      - run: git diff --check
